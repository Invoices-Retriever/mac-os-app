name: A plugin stopped working
description: Report a supplier plugin that no longer collects invoices
labels: ["plugin", "broken"]
body:
  - type: markdown
    attributes:
      value: |
        Portals change constantly, and a broken plugin is expected rather than
        surprising. Thank you for reporting it.

        **Please do not paste your run log without reading it first.** Secrets
        are redacted automatically, but a log can still contain your customer
        number, your invoice numbers and your amounts.
  - type: input
    id: plugin
    attributes:
      label: Plugin id
      placeholder: ovh
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - It cannot tell that I am signed in
        - Sign-in does not complete
        - It signs in but finds no invoices
        - It finds invoices but the download fails
        - The invoices arrive with wrong dates or amounts
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The error the app showed
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed anything identifying from what I pasted above
          required: true
